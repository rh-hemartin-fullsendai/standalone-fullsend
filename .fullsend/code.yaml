---
# harness/signing-code.yaml — code agent with commit signing.
base: https://raw.githubusercontent.com/fullsend-ai/agents/2db65bb9b4296aa7042c5f84a55bf4f8f63794fd/harness/code.yaml#sha256=6ac2a3dc3e163e53137d6839b7f31f17a3942d9ca316741d21a041df6784fb1d
image: ghcr.io/lahavyuv86/fullsend-code:540b27f

role: coder
slug: fullsend-ai-coder

skills:
  - code-implementation

validation_loop:
  script: validate-output-schema.sh
  schema: code-result.schema.json

forge:
  github:
    post_script: post-code.sh

env:
  sandbox:
    # Gitsign OIDC configuration
    GITSIGN_CONNECTOR_ID: "https://github.com/login/oauth"
    GITSIGN_TOKEN_PROVIDER: "github-actions"
    GITSIGN_REKOR_MODE: "offline"
    # Enable signing via GIT_CONFIG_* variables
    GIT_CONFIG_COUNT: "2"
    GIT_CONFIG_KEY_0: "commit.gpgsign"
    GIT_CONFIG_VALUE_0: "true"
    GIT_CONFIG_KEY_1: "tag.gpgsign"
    GIT_CONFIG_VALUE_1: "true"
